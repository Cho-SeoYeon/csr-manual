<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CAPI 지역사회건강조사 전화 응대 매뉴얼">
<title>지사회 CSR 응대 매뉴얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 데스크톱은 좌측 고정 사이드바(검색+분류 탭) + 본문, 폰은 상단 고정 헤더+가로 탭.
   본문은 "응대 가이드(단계·멘트)"와 "과거 케이스(증상·원인·해결 아코디언)" 두 층 */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E9EEED; --line:#D5DEDC; --fg:#15242A; --muted:#5B6B70;
  --accent:#0C6F6C; --accent-ink:#FFFFFF; --accent-soft:#DFF0EE;
  --warn:#8A5A00; --warn-soft:#FBF0DA; --ok:#22693F; --ok-soft:#E3F2E8; --say:#EEF2FB; --say-ink:#2B4580;
  --mark:#FFE07A;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --side:252px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#152023; --sunk:#111A1C; --line:#28373B; --fg:#E2EBEB; --muted:#93A5A9;
  --accent:#5BC2BE; --accent-ink:#0E1618; --accent-soft:#16312F;
  --warn:#E6B45E; --warn-soft:#2B2315; --ok:#76C996; --ok-soft:#15281D; --say:#1A2338; --say-ink:#A9BFF0;
  --mark:#6A5714; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#152023; --sunk:#111A1C; --line:#28373B; --fg:#E2EBEB; --muted:#93A5A9;
  --accent:#5BC2BE; --accent-ink:#0E1618; --accent-soft:#16312F;
  --warn:#E6B45E; --warn-soft:#2B2315; --ok:#76C996; --ok-soft:#15281D; --say:#1A2338; --say-ink:#A9BFF0;
  --mark:#6A5714; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand .logo svg{width:19px;height:19px}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.brand b{display:block;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search input{width:100%;font:inherit;font-size:14.5px;padding:9px 32px 9px 34px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 8px;line-height:1}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-size:14.5px;padding:8px 10px;border-radius:8px;white-space:nowrap}
nav.tabs a:hover{background:var(--sunk)}
nav.tabs a .n{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs a[aria-current="page"] .n{color:var(--accent)}
nav.tabs .sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;line-height:1.5}

main{min-width:0;padding-block:34px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.inner{max-width:880px}

/* type */
h1{font-size:26px;line-height:1.3;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;margin:36px 0 12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
h3{font-size:16px;margin:0}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.crumb{font-size:13px;margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{text-decoration:none}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle}
.badge.new{background:var(--ok-soft);color:var(--ok)}
code,.mono{font-family:var(--f-mono);font-size:.88em}

/* home */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;margin-bottom:28px}
.hero h1{font-size:28px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.stats b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.calls{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.call{display:flex;align-items:center;gap:10px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--fg)}
.call:hover{border-color:var(--accent);background:var(--accent-soft)}
.call svg{color:var(--accent)}
.call span{flex:1;min-width:0;font-weight:500;font-size:14.5px;line-height:1.4}
.call em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.rule .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.rule b{display:block;margin:2px 0 4px}
.rule p{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.path{display:block;margin-top:8px;font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:8px 10px;border-radius:6px;color:var(--fg);overflow-wrap:anywhere}
.patterns{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.patterns div{padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px}
.patterns div:first-child{border-top:0}
.patterns b{display:block;margin-bottom:2px}

/* guide list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.gcard:hover{border-color:var(--accent)}
.gcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard .steps{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.gcard h3{font-size:15.5px;line-height:1.4}
.gcard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}

/* guide detail */
.box{border-radius:10px;padding:13px 16px;margin:0 0 14px}
.box .lab{font-size:12px;font-weight:700;letter-spacing:.05em;margin-bottom:4px}
.box.sit{background:var(--surface);border:1px solid var(--line)}
.box.sit .lab{color:var(--muted)}
.box.cause{background:var(--warn-soft)} .box.cause .lab{color:var(--warn)}
.box.warn{background:var(--warn-soft);border-left:3px solid var(--warn)} .box.warn .lab{color:var(--warn)}
.box.tip{background:var(--ok-soft)} .box.tip .lab{color:var(--ok)}
.box ul{margin:0;padding-left:18px}
.box p{margin:0}
ol.steps{list-style:none;margin:6px 0 18px;padding:0;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 18px 44px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:13px;font-weight:500;display:grid;place-items:center}
ol.steps>li::after{content:"";position:absolute;left:13.5px;top:32px;bottom:4px;width:1px;background:var(--line)}
ol.steps>li:last-child::after{display:none}
ol.steps .t{font-weight:600;padding-top:2px}
ol.steps ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px}
ol.steps .go{font-size:13px;margin-top:4px;display:inline-block}
.says{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.say{position:relative;align-self:flex-start;max-width:100%;background:var(--say);color:var(--say-ink);padding:8px 12px 8px 34px;border-radius:4px 12px 12px 12px;font-size:14.5px}
.say svg{position:absolute;left:10px;top:10px;width:15px;height:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:14px}
.tbl .cap{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);padding:10px 14px 0}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.ref td:first-child{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.check td:first-child{white-space:nowrap;color:var(--accent);font-weight:600}
pre.q{position:relative;margin:0 0 14px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.7}
pre.q button{position:absolute;top:8px;right:8px;font:inherit;font-family:var(--f-body);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer}
.notes{margin:0 0 14px;padding-left:18px;font-size:14.5px;color:var(--muted)}

/* cases */
.cgroup{margin-top:8px}
.cgroup h3{font-size:14.5px;margin:22px 0 4px}
.cgroup .gi{font-size:13.5px;color:var(--muted);margin:0 0 10px;max-width:70ch}
.cases{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.case{border-top:1px solid var(--line)}
details.case:first-child{border-top:0}
details.case summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 16px}
details.case summary::-webkit-details-marker{display:none}
details.case summary:hover{background:var(--sunk)}
.cs-menu{font-size:12.5px;color:var(--accent);font-weight:600}
.cs-q{grid-column:1;font-size:14.5px;line-height:1.5}
.cs-id{grid-row:1/span 2;grid-column:2;align-self:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cs-id::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details[open] .cs-id::after{transform:rotate(-135deg);margin-top:3px}
.cbody{padding:2px 16px 14px;display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;font-size:14.5px}
.crow .l{font-size:12px;font-weight:700;padding-top:6px}
.crow .v{padding:5px 10px;border-radius:7px;overflow-wrap:anywhere}
.crow.c .l{color:var(--warn)} .crow.c .v{background:var(--warn-soft)}
.crow.f .l{color:var(--ok)} .crow.f .v{background:var(--ok-soft)}
.crow ul{margin:0;padding-left:18px}
.cmeta{font-size:12px;color:var(--muted);padding-left:54px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{color:var(--muted);padding:40px 0}
.rel{display:flex;flex-direction:column;gap:8px}

/* phone */
@media (max-width:860px){
  .shell{display:block}
  aside{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));gap:10px}
  .brand .logo{width:28px;height:28px}
  .brand small{display:none}
  .search kbd{display:none}
  nav.tabs{flex-direction:row;overflow-x:auto;gap:2px;margin:0 -4px;padding:0 4px 8px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs a{padding:6px 11px;font-size:14px}
  nav.tabs a svg,nav.tabs .sep,.side-foot{display:none}
  nav.tabs a .n{margin-left:4px}
  main{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{padding:20px 18px}
  .hero h1,h1{font-size:22px}
  .crow{grid-template-columns:1fr;gap:2px}.crow .l{padding-top:0}.cmeta{padding-left:0}
  ol.steps>li{padding-left:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></div>
      <div><small>CAPI 지역사회건강조사</small><b>지사회 CSR 응대 매뉴얼</b></div>
    </div>
    <div class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="증상·메뉴·테이블 검색" autocomplete="off" aria-label="가이드와 케이스 검색">
      <kbd id="kbd">/</kbd>
      <button id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="분류"></nav>
    <div class="side-foot">2025 전화 요청 대응 매뉴얼 + 2025·2026 지사회 CSR 시트 + 2026 추가 케이스를 합친 버전</div>
  </aside>
  <main><div class="inner" id="main"></div></main>

<script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let terms = [];
const hl = s => { let h = esc(s); for (const t of terms) { h = h.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark>${m}</mark>`); } return h; };

// ---------- pieces ----------
function gcard(g){
  return `<a class="gcard" href="#g-${g.id}">
    <div class="top"><span class="badge ${g.src.startsWith('2026')?'new':''}">${esc(g.src)}</span>${stepCount(g)?`<span class="steps">${stepCount(g)}단계</span>`:''}</div>
    <h3>${hl(g.title)}</h3><p>${hl(g.sum)}</p></a>`;
}
function caseItem(i, open, showTab){
  const fix = i.fix.length > 1 ? `<ul>${i.fix.map(f=>`<li>${hl(f)}</li>`).join('')}</ul>` : hl(i.fix[0]);
  const tab = showTab ? tabByKey[tabOfCase(i)] : null;
  return `<details class="case" ${open?'open':''}>
    <summary><span class="cs-menu">${hl(i.menu)}${tab?` · ${esc(tab.title)}`:''}</span><span class="cs-q">${hl(i.q)}</span><span class="cs-id">${esc(i.id)}</span></summary>
    <div class="cbody">
      ${i.cause?`<div class="crow c"><div class="l">원인</div><div class="v">${hl(i.cause)}</div></div>`:''}
      <div class="crow f"><div class="l">해결</div><div class="v">${fix}</div></div>
      <div class="cmeta">${esc(i.date)} · ${hl(i.sys)}</div>
    </div></details>`;
}
const says = arr => arr && arr.length ? `<div class="says">${arr.map(s=>`<div class="say">${ico('phone')}${hl(s)}</div>`).join('')}</div>` : '';
function tableBox(t){ return `<div class="tbl"><div class="cap">${esc(t.title)}</div><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${hl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function related(ids){
  const gs = ids.filter(x=>x.startsWith('g:')).map(x=>gById[x.slice(2)]).filter(Boolean);
  const cs = ids.filter(x=>!x.startsWith('g:')).map(x=>cById[x]).filter(Boolean);
  let h = '';
  if (gs.length) h += `<h2>관련 가이드</h2><div class="glist">${gs.map(gcard).join('')}</div>`;
  if (cs.length) h += `<h2>비슷했던 과거 케이스</h2><div class="cases">${cs.map(i=>caseItem(i,true,false)).join('')}</div>`;
  return h;
}

  const items = [['home','자주 오는 전화',null], ...TABS.map(t=>[t.key,t.title,t.guides.length+t.cases.length]), ['sep'], ['ref','참고자료',null]];
  $('#tabs').innerHTML = items.map(([k,t,n]) => k==='sep' ? '<div class="sep"></div>' :
    `<a href="#${k}" ${k===active?'aria-current="page"':''}>${ico(k)}<span>${t}</span>${n?`<span class="n">${n}</span>`:''}</a>`).join('');
  const cur = $('#tabs [aria-current]'); if (cur && window.innerWidth <= 860) cur.scrollIntoView({block:'nearest',inline:'center'});
}
function route(){
  const q = $('#q').value;
  $('#clear').hidden = !q; $('#kbd').hidden = !!q;
  if (q.trim()) { renderTabs(''); $('#main').innerHTML = viewSearch(q); return; }
  terms = [];
  const h = (location.hash || '#home').slice(1);
  let html, active = h;
  if (h.startsWith('call-') && CALLS[+h.slice(5)]) { html = viewCall(+h.slice(5)); active = 'home'; }
  else if (h.startsWith('g-') && gById[h.slice(2)]) { const g = gById[h.slice(2)]; html = viewGuide(g); active = g.tab; }
  else if (h === 'ref') html = viewRef();
  else if (tabByKey[h]) html = viewTab(tabByKey[h]);
  else { html = viewHome(); active = 'home'; }
  renderTabs(active); $('#main').innerHTML = html;
}
$('#q').addEventListener('input', () => { route(); window.scrollTo(0,0); });
$('#clear').addEventListener('click', () => { $('#q').value=''; route(); $('#q').focus(); });
$('#tabs').addEventListener('click', e => { const a = e.target.closest('a'); if (a && $('#q').value) { $('#q').value=''; if (a.getAttribute('href') === location.hash) route(); } });
$('#main').addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (a && $('#q').value) { $('#q').value=''; if (a.getAttribute('href') === location.hash) route(); }
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const code = b.parentElement.querySelector('code');
  const done = () => { b.textContent = '복사됨'; setTimeout(()=>b.textContent='복사',1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '선택됨'; };
  try { navigator.clipboard.writeText(code.textContent).then(done, fallback); } catch { fallback(); }
});
window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
route();
</script>
</body>
