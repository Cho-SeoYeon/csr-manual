<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CAPI 지역사회건강조사 전화 응대 매뉴얼 · 지사회 업무 매뉴얼">
<title>지사회 CSR 응대 매뉴얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 진한 청록 밴드 가운데에 큰 검색창 고정 → 아래 좌측 분류 탭 + 본문.
   첫 화면은 증상을 주제별 카드로 묶고, 상세는 "처리 순서·응대 멘트" / "과거 케이스(원인·해결)" 두 층 */
:root{
  --band:#1C2A4E; --band-ink:#FFFFFF; --band-muted:#B4C0DC;
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EDF0F6; --line:#D6DCE7; --fg:#101828; --muted:#344054; --faint:#5B6577;
  --accent:#27407A; --accent-ink:#FFFFFF; --accent-soft:#E7ECF7;
  --warn:#8A4B00; --warn-soft:#FFF4E0; --ok:#1B6B43; --ok-soft:#E6F4EC; --say:#EEF2FC; --say-ink:#1F3470;
  --mark:#FFE07A;
  --f-body:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --bar:76px; --side:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#141D36; --band-ink:#EEF2FA; --band-muted:#97A5C6;
  --bg:#0E1322; --surface:#161D31; --sunk:#111829; --line:#2A3450; --fg:#EEF1F7; --muted:#C3CAD9; --faint:#98A2B8;
  --accent:#93AEF0; --accent-ink:#0E1322; --accent-soft:#1E2A4A;
  --warn:#F0BA62; --warn-soft:#2C2416; --ok:#7FD0A0; --ok-soft:#14281D; --say:#1B2442; --say-ink:#C3D2FA;
  --mark:#6A5714; color-scheme:dark }}
:root[data-theme="dark"]{
  --band:#141D36; --band-ink:#EEF2FA; --band-muted:#97A5C6;
  --bg:#0E1322; --surface:#161D31; --sunk:#111829; --line:#2A3450; --fg:#EEF1F7; --muted:#C3CAD9; --faint:#98A2B8;
  --accent:#93AEF0; --accent-ink:#0E1322; --accent-soft:#1E2A4A;
  --warn:#F0BA62; --warn-soft:#2C2416; --ok:#7FD0A0; --ok-soft:#14281D; --say:#1B2442; --say-ink:#C3D2FA;
  --mark:#6A5714; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16.5px;line-height:1.75;letter-spacing:-.005em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;margin:0;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--band)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── 상단 밴드 + 검색 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{background:var(--band);color:var(--band-ink)}
.bar-in{height:var(--bar);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,640px) minmax(0,1fr);align-items:center;gap:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--band-ink);color:var(--band);display:grid;place-items:center;flex:none}
.brand .logo svg{width:20px;height:20px}
.brand small{display:block;font-size:12px;color:var(--band-muted);line-height:1.35}
.brand b{display:block;font-size:16px;line-height:1.35;font-weight:700;white-space:nowrap}
.search{position:relative}
.search>svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--faint);width:20px;height:20px}
.search input{width:100%;height:50px;font:inherit;font-size:16px;padding:0 48px 0 50px;border:0;border-radius:999px;background:var(--surface);color:var(--fg);box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.14)}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0}
.search .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--sunk);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.mtabs{display:none}
.modes{justify-self:end;display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:4px;gap:2px}
.modes a{color:var(--band-muted);text-decoration:none;font-size:14.5px;font-weight:600;padding:7px 15px;border-radius:999px;white-space:nowrap}
.modes a:hover{color:var(--band-ink)}
.modes a[aria-current="true"]{background:var(--band-ink);color:var(--band)}
.wtag{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:2px}

/* ── 본문 레이아웃 ── */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
aside{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--bar));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--fg);font-size:15.5px;font-weight:500;padding:9px 12px;border-radius:9px;white-space:nowrap}
nav.tabs a svg{color:var(--faint)}
nav.tabs a:hover{background:var(--sunk)}
nav.tabs a .n{margin-left:auto;font-size:12.5px;color:var(--faint);font-weight:400}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.tabs a[aria-current="page"] svg,nav.tabs a[aria-current="page"] .n{color:var(--accent)}
nav.tabs .sep{height:1px;background:var(--line);margin:8px 8px}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--faint);padding:0 8px;line-height:1.55}
main{min-width:0;padding-block:40px 96px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.inner{max-width:860px;margin:0 auto}

/* ── 타이포 ── */
h1{font-size:30px;line-height:1.35;margin:0 0 10px;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.sec{display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:700;margin:44px 0 14px;letter-spacing:-.01em}
.sec small{font-size:14px;font-weight:400;color:var(--faint)}
.lead{color:var(--muted);font-size:17px;margin:0 0 8px;max-width:60ch}
.crumb{font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--faint)}
.crumb a{text-decoration:none;font-weight:500}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);line-height:1.6}
.badge.new{background:var(--ok-soft);color:var(--ok)}
code,.mono{font-family:var(--f-mono);font-size:.88em}

/* ── 홈 ── */
.welcome{margin-bottom:28px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stats span{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.stats b{color:var(--fg);font-weight:700;margin-left:5px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px 8px;min-width:0}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.grp-h .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.grp-h b{font-size:16.5px}
.grp a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);padding:13px 2px;border-top:1px solid var(--line);font-size:16px;line-height:1.5;font-weight:500}
.grp-h + a{border-top:0}
.grp a span{flex:1;min-width:0}
.grp a svg{width:16px;height:16px;color:var(--faint);transition:transform .15s}
.grp a:hover{color:var(--accent)}
.grp a:hover svg{color:var(--accent);transform:translateX(3px)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.rule{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.rule .k{flex:none;width:40px;height:40px;border-radius:50%;background:var(--band);color:var(--band-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.rule b{display:block;font-size:16px;margin-bottom:4px}
.rule p{margin:0;font-size:15.5px;color:var(--muted)}
.path{display:block;margin-top:10px;font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:8px 11px;border-radius:8px;color:var(--fg);word-break:break-all}
.patterns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.patterns div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15.5px;color:var(--muted);line-height:1.7}
.patterns b{display:block;margin-bottom:4px;color:var(--fg);font-size:15.5px}

/* ── 가이드 목록 ── */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.gcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;transition:border-color .15s,box-shadow .15s}
.gcard:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(28,42,78,.12)}
.gcard .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard .steps{font-size:12.5px;color:var(--faint)}
.gcard h3{font-size:17px;line-height:1.45;margin:0}
.gcard p{margin:0;font-size:15px;color:var(--muted);line-height:1.65}

/* ── 가이드 상세 ── */
.box{border-radius:14px;padding:16px 20px;margin:0 0 16px}
.box .lab{font-size:13px;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.box.sit{background:var(--surface);border:1px solid var(--line)} .box.sit .lab{color:var(--faint)}
.box.cause{background:var(--warn-soft)} .box.cause .lab{color:var(--warn)}
.box.warn{background:var(--warn-soft);border-left:4px solid var(--warn)} .box.warn .lab{color:var(--warn)}
.box.tip{background:var(--ok-soft)} .box.tip .lab{color:var(--ok)}
.box ul{margin:0;padding-left:20px} .box li+li{margin-top:4px}
.box p{margin:0}
ol.steps{list-style:none;margin:4px 0 20px;padding:0;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 24px 52px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;display:grid;place-items:center}
ol.steps>li::after{content:"";position:absolute;left:16.5px;top:40px;bottom:6px;width:1.5px;background:var(--line)}
ol.steps>li:last-child::after{display:none}
ol.steps .t{font-weight:700;font-size:17px;padding-top:3px;line-height:1.55}
ol.steps ul{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:16px}
ol.steps .go{font-size:14px;margin-top:6px;display:inline-flex;font-weight:500}
.says{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.say{position:relative;align-self:flex-start;max-width:100%;background:var(--say);color:var(--say-ink);padding:10px 16px 10px 42px;border-radius:4px 16px 16px 16px;font-size:15.5px;line-height:1.6}
.say svg{position:absolute;left:14px;top:13px;width:17px;height:17px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:16px}
.tbl .cap{font-size:13px;font-weight:700;color:var(--faint);padding:14px 18px 2px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{padding:12px 18px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--faint);font-weight:700}
tr:last-child td{border-bottom:0}
.ref td:first-child{font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
.check td:first-child{white-space:nowrap;color:var(--accent);font-weight:700}
pre.q{position:relative;margin:0 0 16px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.75}
pre.q button{position:absolute;top:10px;right:10px;font:inherit;font-family:var(--f-body);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:3px 11px;cursor:pointer}
.notes{margin:0 0 16px;padding-left:20px;font-size:15.5px;color:var(--muted)}

/* ── 과거 케이스 ── */
.cgroup h3{font-size:16px;margin:28px 0 4px}
.cgroup .gi{font-size:15px;color:var(--muted);margin:0 0 12px;max-width:68ch}
.cases{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.case{border-top:1px solid var(--line)}
details.case:first-child{border-top:0}
details.case summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:16px 22px}
details.case summary::-webkit-details-marker{display:none}
details.case summary:hover{background:var(--sunk)}
details[open].case summary{background:var(--sunk)}
.cs-menu{font-size:13.5px;color:var(--faint);font-weight:500}
.cs-q{grid-column:1;grid-row:1;font-size:16.5px;line-height:1.6;font-weight:600;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details[open] .cs-q{-webkit-line-clamp:unset}
.cs-menu{grid-column:1;grid-row:2}
.cs-id{grid-row:1/span 2;grid-column:2;align-self:center;font-size:13px;color:var(--faint);display:flex;align-items:center;gap:8px}
.cs-id::after{content:"";width:8px;height:8px;border-right:1.7px solid currentColor;border-bottom:1.7px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details[open] .cs-id::after{transform:rotate(-135deg);margin-top:4px}
.cbody{padding:14px 20px 18px;display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;font-size:16px;line-height:1.75;color:var(--fg)}
.crow .l{font-size:13px;font-weight:700;padding-top:8px}
.crow .v{padding:9px 14px;border-radius:10px}
.crow.c .l{color:var(--warn)} .crow.c .v{background:var(--warn-soft)}
.crow.f .l{color:var(--ok)} .crow.f .v{background:var(--ok-soft)}
.crow ul{margin:0;padding-left:18px} .crow li+li{margin-top:3px}
.cmeta{font-size:13.5px;color:var(--faint);padding-left:60px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.empty{color:var(--muted);padding:48px 0;font-size:16px}
/* 3단 카드 */
.tri{display:flex;flex-direction:column;gap:10px}
.blk{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:start}
.blk .h{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;padding-top:9px;white-space:nowrap}
.blk .h b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;color:#fff;flex:none}
.blk .v{padding:9px 15px;border-radius:10px;min-width:0;line-height:1.75}
.blk .v ul,.blk .v ol{margin:0;padding-left:20px} .blk .v li+li{margin-top:4px}
.blk.s .h{color:var(--fg)} .blk.s .h b{background:var(--fg)} .blk.s .v{background:var(--sunk)}
.blk.c .h{color:var(--warn)} .blk.c .h b{background:var(--warn)} .blk.c .v{background:var(--warn-soft)}
.blk.f .h{color:var(--ok)} .blk.f .h b{background:var(--ok)} .blk.f .v{background:var(--ok-soft)}
.blk .none{color:var(--faint)}
.script{margin-top:6px;border:1.5px solid var(--say-ink);border-radius:12px;overflow:hidden}
.script .sh{display:flex;align-items:center;gap:8px;background:var(--say);color:var(--say-ink);font-size:14px;font-weight:700;padding:8px 14px}
.script .sh svg{width:16px;height:16px}
.script .sh .ty{margin-left:auto;font-weight:500;font-size:12.5px;opacity:.85}
.script ol{list-style:none;margin:0;padding:6px 0;background:var(--surface)}
.script li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:7px 14px;font-size:15.5px;line-height:1.65}
.script li span{font-size:12.5px;font-weight:700;color:var(--say-ink);padding-top:3px}
.script li q{quotes:"“" "”"}
@media (max-width:860px){.blk{grid-template-columns:1fr;gap:4px}.blk .h{padding-top:0}.script li{grid-template-columns:1fr;gap:0}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 13px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.more{display:block;width:100%;margin-top:12px;font:inherit;font-size:15px;padding:13px;border:1.5px dashed var(--line);border-radius:14px;background:transparent;color:var(--accent);cursor:pointer;font-weight:500}
.more:hover{border-color:var(--accent);background:var(--accent-soft)}
.era{font-size:15px;color:var(--muted);margin:0 0 12px;max-width:70ch}
.cs-n{font-family:var(--f-body);font-weight:700;color:var(--accent)}

/* ── 폰 ── */
@media (max-width:860px){
  :root{--bar:auto}
  .bar-in{height:auto;grid-template-columns:1fr;gap:12px;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand .logo{width:30px;height:30px}.brand .logo svg{width:17px;height:17px}
  .brand small{display:none}
  .search input{height:46px}
  .search kbd,aside{display:none}
  .modes{justify-self:stretch;order:-1}.modes a{flex:1;text-align:center;font-size:14px;padding:7px 8px}
  .bar-in>.brand{display:none}
  .mtabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;gap:4px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));scrollbar-width:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mtabs a{flex:none;text-decoration:none;color:var(--muted);font-size:14.5px;padding:6px 13px;border-radius:99px;white-space:nowrap}

function scriptType(text){

  if (/부가정보|회원가입|가입|권한|승인|간편인증|인증서/.test(t)) return 'account';

async function loadDB(){
  if (!SB) return;
  try {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await SB.from('cases').select('*').order('id').range(from, from + 999);
      if (error) throw error;
      rows.push(...data);

    if (rows.length) { ITEMS = rows.map(fromRow); SOURCE = 'db'; reindex(); route(); }
  } catch (e) { console.warn('DB 불러오기 실패, 내장 데이터로 표시합니다.', e); }
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let terms = [];
const hl = s => { let h = esc(s); for (const t of terms) { h = h.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark>${m}</mark>`); } return h; };
const ulOrText = a => a.length > 1 ? `<ul>${a.map(f=>`<li>${hl(f)}</li>`).join('')}</ul>` : hl(a[0] || '');

function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2600); }
const norm = t => (t||'').toLowerCase().replace(/[^가-힣a-z0-9]/g, '');
function bigrams(t){ const s = norm(t), set = new Set(); for (let i = 0; i < s.length - 1; i++) set.add(s.slice(i, i+2)); return set; }
function dice(a, b){ if (!a.size || !b.size) return 0; let n = 0; for (const x of a) if (b.has(x)) n++; return 2 * n / (a.size + b.size); }
function similar(q, manual){
  const qb = bigrams(q); if (qb.size < 2) return [];
  return ITEMS.filter(i => i.manual === manual)
    .map(i => { if (!i._bg) i._bg = bigrams(i.q); return [i, dice(qb, i._bg)]; })
    .filter(([, s]) => s >= 0.3).sort((a, b) => b[1] - a[1]).slice(0, 5);
}

const lines = t => t.split('\n').map(x => x.trim()).filter(Boolean);
async function saveForm(){
  const msg = $('#fmsg'), btn = $('#f-save');
  const v = { manual: $('#f-manual').value, tab: $('#f-tab').value, menu: $('#f-menu').value.trim(), sys: $('#f-sys').value.trim(),
    date: $('#f-date').value, q: $('#f-q').value.trim(), cause: $('#f-cause').value.trim(), fix: lines($('#f-fix').value) };
  if (!v.q || !v.fix.length) { msg.className = 'msg err'; msg.textContent = '증상과 대처법은 꼭 입력해 주세요.'; return; }
  const year = (v.date || new Date().toISOString()).slice(0, 4);
  const mergeId = (document.querySelector('input[name="merge"]:checked') || {}).value;
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '저장 중…';
  let res, dest = v.tab;
  const now = new Date().toISOString();
  if (FORM.id != null) {
    res = await SB.from('cases').update({ manual:v.manual, tab:v.tab, menu:v.menu, sys:v.sys, date:v.date, symptom:v.q, cause:v.cause, fix:v.fix, updated_at:now }).eq('id', FORM.id);
  } else if (mergeId) {
    const t = byId[mergeId];
    const have = new Set(t.fix.map(norm));
    const fix = [...t.fix, ...v.fix.filter(f => !have.has(norm(f)))];
    const years = [...new Set([...(t.years||[]), year])].sort();
    res = await SB.from('cases').update({ n:(t.n||1)+1, fix, years, cause: t.cause || v.cause, updated_at:now }).eq('id', t.id);
    dest = t.tab;
  } else {
    res = await SB.from('cases').insert({ manual:v.manual, tab:v.tab, grp:NEW_GRP, menu:v.menu, sys:v.sys, date:v.date, symptom:v.q, cause:v.cause, fix:v.fix, years:[year], n:1, src:'직접 등록' });
  }
  btn.disabled = false;
  if (res.error) { msg.className = 'msg err'; msg.textContent = '저장하지 못했습니다: ' + res.error.message; return; }
  sessionSet('lastTab_' + v.manual, v.tab);
  await loadDB();
  toast(FORM.id != null ? '저장했습니다' : mergeId ? '기존 케이스에 합쳤습니다' : '새 케이스를 등록했습니다');
  location.hash = '#' + dest;
}

  const { error } = await SB.from('cases').delete().eq('id', +btn.dataset.del);
  if (error) { $('#fmsg').className = 'msg err'; $('#fmsg').textContent = '삭제하지 못했습니다: ' + error.message; btn.disabled = false; return; }
  const tab = byId[btn.dataset.del] ? byId[btn.dataset.del].tab : 'home';
  await loadDB(); toast('삭제했습니다'); location.hash = '#' + tab;
}

  document.querySelectorAll('#modes a').forEach((a,k) => a.setAttribute('aria-current', String((k===0) === (m==='phone'))));
  $('#btitle').textContent = m === 'work' ? '지사회 업무 매뉴얼' : 'CAPI 전화 응대 매뉴얼';
  $('#q').placeholder = window.innerWidth <= 520 ? (m === 'work' ? '업무 기록 검색' : '증상·메뉴·테이블명 검색') : (m === 'work' ? '요청 내용·메뉴명으로 업무 기록 검색' : '증상·메뉴·테이블명으로 검색 (예: 로그인, 재검독, 흰 화면)');
  document.querySelector('.side-foot').textContent = m === 'work' ? '2025–2026 지사회 CSR 시트 중 기능 변경·콘텐츠·정기 작업 기록' : '2017–2023 CAPI 이슈관리 · 2024 주차별 CSR · 2025 전화 요청 대응 매뉴얼 · 2025–2026 지사회 CSR 시트 중 전화 응대 기록';
  $('#foot').innerHTML = `<span>${SOURCE === 'db' ? 'DB 연결됨' : '내장 데이터'}</span><a href="#admin">${ADMIN ? '관리자 (' + esc(EMAIL) + ')' : '관리자 로그인'}</a>`;
}
function route(){
  const h = (location.hash || '#home').slice(1);
  const formLike = h === 'new' || h.startsWith('edit-') || h === 'admin';
  if (!formLike) setMode(h === 'work' || h.startsWith('w-') ? 'work' : 'phone'); else setMode(MODE);
  const q = $('#q').value;
  $('#clear').hidden = !q; $('#kbd').hidden = !!q;
  if (q.trim() && !formLike) { renderTabs(''); $('#main').innerHTML = MODE === 'work' ? viewWorkSearch(q) : viewSearch(q); return; }
  terms = [];
  let html, active = h;
  if (h === 'admin') html = viewAdmin();
  else if (h === 'new') { html = viewForm(null); }
  else if (h.startsWith('edit-')) { const it = byId[h.slice(5)]; html = it ? viewForm(it) : `<h1>케이스를 찾을 수 없습니다</h1>`; active = ''; }
  else if (MODE === 'work') {
    if (WTAB[h]) html = viewWorkTab(WTAB[h]); else if (h === 'w-ref') html = viewWorkRef(); else { html = viewWorkHome(); active = 'work'; }
  }
  else if (h.startsWith('call-') && CALLS[+h.slice(5)]) { html = viewCall(+h.slice(5)); active = 'home'; }
  else if (h.startsWith('g-') && gById[h.slice(2)]) { const g = gById[h.slice(2)]; html = viewGuide(g); active = g.tab; }
  else if (h === 'ref') html = viewRef();
  else if (TAB[h]) html = viewTab(TAB[h]);
  else { html = viewHome(); active = 'home'; }
  renderTabs(active); $('#main').innerHTML = html;
  if (h === 'new' && ADMIN) renderSimilar();
}

// ---------- 이벤트 ----------
const clearIfSearching = e => { const a = e.target.closest('a[href^="#"]'); if (a && $('#q').value) { $('#q').value=''; if (a.getAttribute('href') === (location.hash||'#home')) route(); } };
$('#q').addEventListener('input', () => { route(); window.scrollTo(0,0); });
$('#clear').addEventListener('click', () => { $('#q').value=''; route(); $('#q').focus(); });
let simT;
document.addEventListener('input', e => { if (e.target.id === 'f-q') { clearTimeout(simT); simT = setTimeout(renderSimilar, 250); } });
document.addEventListener('change', e => {
  if (e.target.id === 'f-manual') { $('#f-tab').innerHTML = tabOptions(e.target.value, sessionGet('lastTab_' + e.target.value)); renderSimilar(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'caseform') return saveForm();
  if (e.target.id === 'loginform') {
    const m = $('#lmsg'); m.className = 'msg'; m.textContent = '로그인 중…';
    const { error } = await SB.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-pw').value });
    if (error) { m.className = 'msg err'; m.textContent = '로그인하지 못했습니다. 이메일과 비밀번호를 확인해 주세요.'; return; }
    toast('로그인했습니다'); location.hash = '#new';
  }
});
document.addEventListener('click', async e => {
  clearIfSearching(e);
  const yb = e.target.closest('[data-year]');
  if (yb) { OLD.year = yb.dataset.year; OLD.limit = 20; $('#oldchips').innerHTML = oldChips(); $('#oldlist').innerHTML = oldList(); return; }
  if (e.target.closest('[data-more]')) { OLD.limit += 30; $('#oldlist').innerHTML = oldList(); return; }
  const del = e.target.closest('[data-del]'); if (del) return deleteItem(del);
  if (e.target.closest('[data-logout]')) { await SB.auth.signOut(); toast('로그아웃했습니다'); location.hash = '#home'; return; }
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const code = b.parentElement.querySelector('code');
  const done = () => { b.textContent = '복사됨'; setTimeout(()=>b.textContent='복사',1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '선택됨'; };
  try { navigator.clipboard.writeText(code.textContent).then(done, fallback); } catch { fallback(); }
});
window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });
route();
loadDB();
</script>
</body>
